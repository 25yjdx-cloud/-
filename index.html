<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#071a31">
    <meta name="description" content="رفيقك اليومي للقرآن الكريم والأذكار والتسبيح والأدعية">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>زاد | القرآن والأذكار والأدعية</title>
    <style>
      #app-splash{position:fixed;inset:0;z-index:3000;display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,#164535,#071a31 72%);color:#fff;opacity:1;visibility:visible;transition:opacity .35s ease,visibility .35s ease}
      #app-splash.is-hidden{opacity:0;visibility:hidden;pointer-events:none}
      #app-splash .app-splash-content{display:grid;justify-items:center;gap:.85rem;padding:1.5rem;text-align:center}
      #app-splash .app-splash-mark{display:grid;width:5rem;height:5rem;place-items:center;border:1px solid #d6b57d;border-radius:1.6rem;background:#ffffff12;color:#f0d9a6;font-size:2.7rem;font-weight:800}
      #app-splash .app-splash-content>strong{font-size:1.8rem}
      #app-splash .app-splash-spinner{width:1.6rem;height:1.6rem;border:2px solid #ffffff55;border-top-color:#f0d9a6;border-radius:50%;animation:zad-splash-spin .8s linear infinite}
      @keyframes zad-splash-spin{to{transform:rotate(360deg)}}
      @media(prefers-reduced-motion:reduce){#app-splash{transition:none}#app-splash .app-splash-spinner{animation:none}}
    </style>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./assets/icons/icon-192x192.png">
    <link rel="apple-touch-icon" href="./assets/icons/icon-192x192.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  </head>
  <body>
    <div id="app-splash" class="app-splash" role="status" aria-live="polite">
      <div class="app-splash-content">
        <span class="app-splash-mark" aria-hidden="true">ز</span>
        <strong>زاد</strong>
        <span>جارٍ تجهيز مساحتك للقرآن والذكر</span>
        <span class="app-splash-spinner" aria-hidden="true"></span>
      </div>
    </div>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
